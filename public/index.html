<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&C Koshi - PTR Test Report System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Times New Roman', Arial, sans-serif; background: #e8e8e8; }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
        }
        .login-card {
            background: white;
            padding: 40px;
            width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .login-card h2 { margin-bottom: 10px; color: #2c3e50; text-align: center; }
        .login-card h3 { text-align: center; margin-bottom: 30px; color: #666; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .login-btn:hover { background: #1a2a3a; }
        .error-msg { color: red; margin-bottom: 15px; display: none; text-align: center; }
        
        .app-container { display: none; }
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-logout {
            background: #c0392b;
            color: white;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
        }
        
        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        .grid-section {
            background: white;
            border: 1px solid #ccc;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .grid-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .grid-btn {
            padding: 8px 20px;
            border: 1px solid #ccc;
            cursor: pointer;
            background: #f8f9fa;
        }
        .grid-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            padding: 8px 20px;
            border: none;
            cursor: pointer;
        }
        
        .main-layout { display: flex; gap: 20px; }
        .sidebar {
            width: 280px;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            height: fit-content;
        }
        .content-area {
            flex: 1;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }
        
        .menu-section { margin-bottom: 25px; }
        .menu-title {
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            background: #2c3e50;
            color: white;
            margin-bottom: 10px;
            text-align: center;
        }
        .equipment-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .equipment-list li {
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            background: #f8f9fa;
            border: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .equipment-list li.active {
            background: #2c3e50;
            color: white;
        }
        .btn-add-equipment {
            width: 100%;
            padding: 8px;
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
        }
        
        .current-equipment {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #2c3e50;
            font-size: 14px;
        }
        .test-group {
            background: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-group h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #2c3e50;
            font-weight: bold;
        }
        .test-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 12px;
        }
        .test-table th, .test-table td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
        }
        .test-table th {
            background: #f0f0f0;
            font-weight: bold;
        }
        .test-table input {
            width: 80px;
            padding: 5px;
            border: 1px solid #ccc;
            text-align: center;
            font-family: monospace;
        }
        .inline-input {
            display: inline-block;
            margin: 0 15px 10px 0;
        }
        .inline-input input {
            width: 100px;
            padding: 5px;
            margin-left: 5px;
            border: 1px solid #ccc;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: inherit;
            resize: vertical;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .btn-save {
            background: #27ae60;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background: #c0392b;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print {
            background: #2980b9;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            width: 450px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            display: none;
            z-index: 1000;
            color: white;
            font-weight: bold;
        }
        
        @media print {
            .sidebar, .grid-section, .action-buttons, .header, .btn-add-equipment, .btn-delete, .user-info {
                display: none;
            }
            .content-area {
                margin: 0;
                padding: 0;
            }
            .test-group {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .test-table input {
                border: none;
                background: transparent;
            }
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h2>T&C Koshi</h2>
            <h3>PTR Test Report Management System</h3>
            <div id="loginError" class="error-msg"></div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
            <p style="text-align: center; margin-top: 20px; color: #666;">Demo: admin / admin123</p>
        </div>
    </div>

    <div id="mainApp" class="app-container">
        <div class="header">
            <h2>T&C Koshi - PTR Test Report Management</h2>
            <div>
                <span id="userNameDisplay"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <div class="grid-section">
                <div class="grid-buttons" id="gridButtons"></div>
                <button class="btn-add" onclick="showAddGridModal()">+ New Grid</button>
            </div>

            <div class="main-layout">
                <div class="sidebar">
                    <div class="menu-section">
                        <div class="menu-title">POWER TRANSFORMERS</div>
                        <ul class="equipment-list" id="transformerList"></ul>
                        <button class="btn-add-equipment" onclick="showAddEquipmentModal()">+ Add PTR</button>
                    </div>
                </div>

                <div class="content-area">
                    <div id="testArea">
                        <div class="current-equipment" id="currentEquipmentDisplay">
                            Select a PTR from the menu to begin testing
                        </div>
                        <div id="testForm"></div>
                        <div class="action-buttons" id="actionButtons" style="display: none;">
                            <button class="btn-save" onclick="saveTestData()">Save Test Results</button>
                            <button class="btn-pdf" onclick="generateFullReport()">Download PDF</button>
                            <button class="btn-print" onclick="printFullReport()">Print Report</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addGridModal" class="modal">
        <div class="modal-content">
            <h3>Add New Grid</h3>
            <input type="text" id="gridName" placeholder="Grid Name">
            <input type="text" id="gridLocation" placeholder="Location">
            <div class="modal-buttons">
                <button class="btn-save" onclick="addGrid()">Add</button>
                <button class="btn-pdf" onclick="closeModal('addGridModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="addEquipmentModal" class="modal">
        <div class="modal-content">
            <h3>Add Power Transformer (PTR)</h3>
            <input type="text" id="eqId" placeholder="Equipment ID (e.g., PTR-01)">
            <input type="text" id="eqRating" placeholder="Rating (e.g., 20 MVA)">
            <input type="text" id="eqMake" placeholder="Make (e.g., CGL, BHEL)">
            <input type="text" id="eqSerial" placeholder="Serial Number">
            <select id="eqVoltage">
                <option value="132/33kV">Voltage Ratio: 132/33 kV</option>
                <option value="220/132kV">Voltage Ratio: 220/132 kV</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-save" onclick="addEquipment()">Add PTR</button>
                <button class="btn-pdf" onclick="closeModal('addEquipmentModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

    <script>
        const API_URL = '/api';
        let authToken = localStorage.getItem('token');
        let currentGrid = null;
        let currentEquipment = null;
        let currentUser = null;

        let testData = {
            dateOfTesting: new Date().toISOString().split('T')[0],
            coreBalance: { VRY: '', VYB: '', VRB: '' },
            magRows: [
                { tap: '', vrn: '', vyn: '', vbn: '', vrn_lv: '', vyn_lv: '', vbn_lv: '' },
                { tap: '', vrn: '', vyn: '', vbn: '', vrn_lv: '', vyn_lv: '', vbn_lv: '' },
                { tap: '', vrn: '', vyn: '', vbn: '', vrn_lv: '', vyn_lv: '', vbn_lv: '' }
            ],
            scRows: [
                { tap: '', ir: '', iy: '', ib: '', ir_lv: '', iy_lv: '', ib_lv: '', in_hv: '', in_lv: '' },
                { tap: '', ir: '', iy: '', ib: '', ir_lv: '', iy_lv: '', ib_lv: '', in_hv: '', in_lv: '' },
                { tap: '', ir: '', iy: '', ib: '', ir_lv: '', iy_lv: '', ib_lv: '', in_hv: '', in_lv: '' }
            ],
            vectorGroup: { v1v2: '', v1w2: '', w1v2: '', w1w2: '', un: '' },
            wrRows: [
                { tap: '', oti: '', wti_hv: '', wti_lv: '', hv_u: '', hv_v: '', hv_w: '', lv_u: '', lv_v: '', lv_w: '' },
                { tap: '', oti: '', wti_hv: '', wti_lv: '', hv_u: '', hv_v: '', hv_w: '', lv_u: '', lv_v: '', lv_w: '' },
                { tap: '', oti: '', wti_hv: '', wti_lv: '', hv_u: '', hv_v: '', hv_w: '', lv_u: '', lv_v: '', lv_w: '' }
            ],
            ir: {
                hv_lv_60: '', hv_lv_600: '', hv_lv_pi: '',
                hv_e_60: '', hv_e_600: '', hv_e_pi: '',
                lv_e_60: '', lv_e_600: '', lv_e_pi: ''
            },
            cft: { core_frame: '', frame_tank: '', core_tank: '' },
            trRows: [
                { tap: '', u: '', v: '', w: '' },
                { tap: '', u: '', v: '', w: '' },
                { tap: '', u: '', v: '', w: '' }
            ],
            dcVoltage: {
                source1: { pn: '', pe: '', ne: '' },
                source2: { pn: '', pe: '', ne: '' }
            },
            earthing: { hv_e: '', lv_e: '', body: '' },
            signatories: {
                critl: [{ name: '', sign: '' }, { name: '', sign: '' }, { name: '', sign: '' }],
                tc: [{ name: '', sign: '' }, { name: '', sign: '' }, { name: '', sign: '' }],
                field: [{ name: '', sign: '' }, { name: '', sign: '' }, { name: '', sign: '' }]
            },
            notes: ''
        };

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    authToken = data.token;
                    currentUser = data.user;
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('userNameDisplay').innerHTML = data.user.fullName || data.user.username;
                    await loadGrids();
                    showStatus('Login successful!', '#27ae60');
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Cannot connect to server.');
            }
        }

        async function loadGrids() {
            try {
                const response = await fetch(`${API_URL}/grids`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const grids = await response.json();
                const container = document.getElementById('gridButtons');
                container.innerHTML = '';
                
                grids.forEach(grid => {
                    const btn = document.createElement('button');
                    btn.className = 'grid-btn';
                    btn.textContent = grid.name;
                    btn.onclick = () => {
                        document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentGrid = grid;
                        loadEquipment();
                    };
                    container.appendChild(btn);
                });
                
                if (grids.length > 0 && !currentGrid) {
                    document.querySelector('.grid-btn').click();
                }
            } catch (error) {
                showStatus('Error loading grids', '#e74c3c');
            }
        }

        async function loadEquipment() {
            if (!currentGrid) return;
            try {
                const response = await fetch(`${API_URL}/equipment/${currentGrid._id}/transformer`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const equipment = await response.json();
                const container = document.getElementById('transformerList');
                container.innerHTML = '';
                
                if (equipment.length === 0) {
                    container.innerHTML = '<li style="text-align: center; color: #999;">No PTRs. Click "Add PTR"</li>';
                    return;
                }
                
                equipment.forEach(eq => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div style="flex:1">
                            <strong>${eq.equipmentId}</strong>
                            <div style="font-size: 11px;">${eq.rating || ''} | ${eq.make || ''}</div>
                        </div>
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteEquipment('${eq._id}')">✖</button>
                    `;
                    li.onclick = () => {
                        document.querySelectorAll('.equipment-list li').forEach(l => l.classList.remove('active'));
                        li.classList.add('active');
                        currentEquipment = eq;
                        if (eq.testValues && eq.testValues[0]) {
                            try {
                                Object.assign(testData, JSON.parse(eq.testValues[0]));
                            } catch(e) {}
                        }
                        loadTestForm();
                        document.getElementById('actionButtons').style.display = 'flex';
                    };
                    container.appendChild(li);
                });
            } catch (error) {
                console.error(error);
            }
        }

        function loadTestForm() {
            let html = `
                <div class="current-equipment">
                    <strong>${currentEquipment.rating || ''} ${currentEquipment.equipmentId}</strong> | Make: ${currentEquipment.make || 'N/A'} | SN: ${currentEquipment.serialNumber || 'N/A'}<br>
                    Voltage Ratio: ${currentEquipment.voltageRatio || 'N/A'} | Test Date: <input type="date" id="testDate" value="${testData.dateOfTesting}">
                </div>

                <div class="test-group">
                    <h4>1. Core Balance and Magnetising Current Test</h4>
                    <div><span class="inline-input">VRY: <input type="text" id="cb_vry" value="${testData.coreBalance.VRY}" style="width:80px"> V</span>
                         <span class="inline-input">VYB: <input type="text" id="cb_vyb" value="${testData.coreBalance.VYB}" style="width:80px"> V</span>
                         <span class="inline-input">VRB: <input type="text" id="cb_vrb" value="${testData.coreBalance.VRB}" style="width:80px"> V</span>
                    </div>
                    <table class="test-table">
                        <tr><th>Tap</th><th>VRN (HV)</th><th>VYN (HV)</th><th>VBN (HV)</th><th>Vrn (LV)</th><th>Vyn (LV)</th><th>Vbn (LV)</th></tr>
                        ${[0,1,2].map(i => `<tr>
                            <td><input type="text" id="mag_tap_${i}" value="${testData.magRows[i].tap}" placeholder="Tap" style="width:60px"></td>
                            <td><input type="text" id="mag_${i}_vrn" value="${testData.magRows[i].vrn}" style="width:70px"></td>
                            <td><input type="text" id="mag_${i}_vyn" value="${testData.magRows[i].vyn}" style="width:70px"></td>
                            <td><input type="text" id="mag_${i}_vbn" value="${testData.magRows[i].vbn}" style="width:70px"></td>
                            <td><input type="text" id="mag_${i}_vrn_lv" value="${testData.magRows[i].vrn_lv}" style="width:70px"></td>
                            <td><input type="text" id="mag_${i}_vyn_lv" value="${testData.magRows[i].vyn_lv}" style="width:70px"></td>
                            <td><input type="text" id="mag_${i}_vbn_lv" value="${testData.magRows[i].vbn_lv}" style="width:70px"></td>
                        </tr>`).join('')}
                    </table>
                </div>

                <div class="test-group">
                    <h4>2. Short Circuit Test</h4>
                    <table class="test-table">
                        <tr><th>Tap</th><th>IR</th><th>IY</th><th>IB</th><th>Ir</th><th>Iy</th><th>Ib</th><th>IN</th><th>In</th></tr>
                        ${[0,1,2].map(i => `<tr>
                            <td><input type="text" id="sc_tap_${i}" value="${testData.scRows[i].tap}" placeholder="Tap" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_ir" value="${testData.scRows[i].ir}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_iy" value="${testData.scRows[i].iy}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_ib" value="${testData.scRows[i].ib}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_ir_lv" value="${testData.scRows[i].ir_lv}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_iy_lv" value="${testData.scRows[i].iy_lv}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_ib_lv" value="${testData.scRows[i].ib_lv}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_in_hv" value="${testData.scRows[i].in_hv}" style="width:60px"></td>
                            <td><input type="text" id="sc_${i}_in_lv" value="${testData.scRows[i].in_lv}" style="width:60px"></td>
                        </tr>`).join('')}
                    </table>
                </div>

                <div class="test-group">
                    <h4>3. Vector Group (YNyn0)</h4>
                    <table class="test-table">
                        <tr><th>1V-2V (V)</th><th>1V-2W (V)</th><th>1W-2V (V)</th><th>1W-2W (V)</th><th>1UN = 2Un + Nn (V)</th></tr>
                        <tr>
                            <td><input type="text" id="vg_v1v2" value="${testData.vectorGroup.v1v2}" style="width:80px"></td>
                            <td><input type="text" id="vg_v1w2" value="${testData.vectorGroup.v1w2}" style="width:80px"></td>
                            <td><input type="text" id="vg_w1v2" value="${testData.vectorGroup.w1v2}" style="width:80px"></td>
                            <td><input type="text" id="vg_w1w2" value="${testData.vectorGroup.w1w2}" style="width:80px"></td>
                            <td><input type="text" id="vg_un" value="${testData.vectorGroup.un}" style="width:80px"></td>
                        </tr>
                    </table>
                </div>

                <div class="test-group">
                    <h4>4. Winding Resistance Test</h4>
                    <table class="test-table">
                        <tr><th>Tap</th><th>OTI (°C)</th><th>WTI HV (°C)</th><th>WTI LV (°C)</th><th>HV U-N (Ω)</th><th>HV V-N (Ω)</th><th>HV W-N (Ω)</th><th>LV u-n (Ω)</th><th>LV v-n (Ω)</th><th>LV w-n (Ω)</th></tr>
                        ${[0,1,2].map(i => `<tr>
                            <td><input type="text" id="wr_tap_${i}" value="${testData.wrRows[i].tap}" placeholder="Tap" style="width:55px"></td>
                            <td><input type="text" id="wr_oti_${i}" value="${testData.wrRows[i].oti}" style="width:50px"></td>
                            <td><input type="text" id="wr_wti_hv_${i}" value="${testData.wrRows[i].wti_hv}" style="width:55px"></td>
                            <td><input type="text" id="wr_wti_lv_${i}" value="${testData.wrRows[i].wti_lv}" style="width:55px"></td>
                            <td><input type="text" id="wr_hv_u_${i}" value="${testData.wrRows[i].hv_u}" style="width:60px"></td>

        async function saveTestData() {
            if (!currentEquipment) { showStatus('No PTR selected', '#e74c3c'); return; }
            collectFormData();
            
            try {
                const response = await fetch(`${API_URL}/equipment/${currentEquipment._id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ testValues: [JSON.stringify(testData)], remarks: testData.notes })
                });
                if (response.ok) {
                    showStatus('Test data saved successfully!', '#27ae60');
                } else {
                    showStatus('Error saving data', '#e74c3c');
                }
            } catch (error) {
                showStatus('Error saving data', '#e74c3c');
            }
        }

                        <div class="section-title">11. Signatories</div>
                        <table style="border: none; width: 100%;">
                            <tr>
                                <td style="border: none; width: 33%; vertical-align: top;">
                                    <strong>CRITL</strong><br><br>
                                    ${testData.signatories.critl.map(s => `${s.name || '_________________'}<br>(${s.sign || 'Signature'})<br><br>`).join('')}
                                </td>
                                <td style="border: none; width: 33%; vertical-align: top;">
                                    <strong>T&C Koshi</strong><br><br>
                                    ${testData.signatories.tc.map(s => `${s.name || '_________________'}<br>(${s.sign || 'Signature'})<br><br>`).join('')}
                                </td>
                                <td style="border: none; width: 33%; vertical-align: top;">
                                    <strong>Field</strong><br><br>
                                    ${testData.signatories.field.map(s => `${s.name || '_________________'}<br>(${s.sign || 'Signature'})<br><br>`).join('')}
                                </td>
                            </tr>
                        </table>
                    </div>
                    
                    <div class="footer">Generated by T&C Koshi Test Management System on ${new Date().toLocaleString()}</div>
                </body>
                </html>
            `;
        }

        function generateFullReport() {
            if (!currentEquipment) { showStatus('No PTR selected', '#e74c3c'); return; }
            collectFormData();
            
            const reportHtml = generateReportHTML();
            const win = window.open('', '_blank');
            win.document.write(reportHtml);
            win.document.close();
            win.print();
        }

        function printFullReport() {
            if (!currentEquipment) { showStatus('No PTR selected', '#e74c3c'); return; }
            collectFormData();
            
            const reportHtml = generateReportHTML();
            const win = window.open('', '_blank');
            win.document.write(reportHtml);
            win.document.close();
            win.print();
        }

        async function addEquipment() {
            const equipmentId = document.getElementById('eqId').value.trim();
            if (!equipmentId) { showStatus('Equipment ID required', '#e74c3c'); return; }
            
            const equipmentData = {
                gridId: currentGrid._id,
                equipmentType: 'transformer',
                equipmentId: equipmentId,
                name: equipmentId,
                rating: document.getElementById('eqRating').value,
                make: document.getElementById('eqMake').value,
                serialNumber: document.getElementById('eqSerial').value,
                voltageRatio: document.getElementById('eqVoltage').value,
                testValues: []
            };
            
            try {
                const response = await fetch(`${API_URL}/equipment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(equipmentData)
                });
                if (response.ok) {
                    closeModal('addEquipmentModal');
                    showStatus('PTR added successfully!', '#27ae60');
                    loadEquipment();
                } else {
                    const error = await response.json();
                    showStatus(error.error || 'Error adding PTR', '#e74c3c');
                }
            } catch (error) {
                showStatus('Error adding PTR', '#e74c3c');
            }
        }

        async function deleteEquipment(id) {
            if (confirm('Delete this PTR? All test data will be lost!')) {
                try {
                    await fetch(`${API_URL}/equipment/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    loadEquipment();
                    if (currentEquipment && currentEquipment._id === id) {
                        currentEquipment = null;
                        document.getElementById('testForm').innerHTML = '';
                        document.getElementById('actionButtons').style.display = 'none';
                    }
                    showStatus('PTR deleted', '#27ae60');
                } catch (error) {
                    showStatus('Error deleting', '#e74c3c');
                }
            }
        }

        function showAddGridModal() { document.getElementById('addGridModal').style.display = 'flex'; }
        
        async function addGrid() {
            const name = document.getElementById('gridName').value.trim();
            if (!name) { showStatus('Grid name required', '#e74c3c'); return; }
            try {
                const response = await fetch(`${API_URL}/grids`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ name, location: document.getElementById('gridLocation').value })
                });
                if (response.ok) {
                    closeModal('addGridModal');
                    showStatus('Grid added!', '#27ae60');
                    loadGrids();
                } else {
                    const error = await response.json();
                    showStatus(error.error, '#e74c3c');
                }
            } catch (error) {
                showStatus('Error adding grid', '#e74c3c');
            }
        }

        function showAddEquipmentModal() {
            if (!currentGrid) { showStatus('Please select a grid first', '#e74c3c'); return; }
            document.getElementById('addEquipmentModal').style.display = 'flex';
        }

        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        function logout() { localStorage.clear(); location.reload(); }
        function showStatus(msg, color) {
            const div = document.getElementById('statusMsg');
            div.textContent = msg;
            div.style.backgroundColor = color;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 3000);
        }
        function showError(msg) {
            const div = document.getElementById('loginError');
            div.textContent = msg;
            div.style.display = 'block';
        }

        if (authToken) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerHTML = user.fullName || user.username;
            loadGrids();
        }
    </script>
</body>
</html>
