<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&C Koshi - PTR Test Report System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Times New Roman', Arial, sans-serif; background: #e8e8e8; }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
        }
        .login-card {
            background: white;
            padding: 40px;
            width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .login-card h2 { margin-bottom: 10px; color: #2c3e50; text-align: center; }
        .login-card h3 { text-align: center; margin-bottom: 30px; color: #666; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .login-btn:hover { background: #1a2a3a; }
        .error-msg { color: red; margin-bottom: 15px; display: none; text-align: center; }
        
        .app-container { display: none; }
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-logout {
            background: #c0392b;
            color: white;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
        }
        
        .version-bar {
            background: #f0f0f0;
            padding: 5px 20px;
            font-size: 11px;
            text-align: right;
            border-bottom: 1px solid #ccc;
            color: #666;
        }
        
        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        .grid-section {
            background: white;
            border: 1px solid #ccc;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .grid-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .grid-btn {
            padding: 8px 20px;
            border: 1px solid #ccc;
            cursor: pointer;
            background: #f8f9fa;
        }
        .grid-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            padding: 8px 20px;
            border: none;
            cursor: pointer;
        }
        
        .main-layout { display: flex; gap: 20px; }
        .sidebar {
            width: 280px;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            height: fit-content;
        }
        .content-area {
            flex: 1;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }
        
        .menu-section { margin-bottom: 25px; }
        .menu-title {
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            background: #2c3e50;
            color: white;
            margin-bottom: 10px;
            text-align: center;
        }
        .equipment-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .equipment-list li {
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            background: #f8f9fa;
            border: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .equipment-list li.active {
            background: #2c3e50;
            color: white;
        }
        .btn-add-equipment {
            width: 100%;
            padding: 8px;
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
        }
        
        .current-equipment {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #2c3e50;
            font-size: 14px;
        }
        .test-group {
            background: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-group h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #2c3e50;
            font-weight: bold;
        }
        .test-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 12px;
        }
        .test-table th, .test-table td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
        }
        .test-table th {
            background: #f0f0f0;
            font-weight: bold;
        }
        .test-table input {
            width: 80px;
            padding: 5px;
            border: 1px solid #ccc;
            text-align: center;
            font-family: monospace;
        }
        .inline-input {
            display: inline-block;
            margin: 0 15px 10px 0;
        }
        .inline-input input {
            width: 100px;
            padding: 5px;
            margin-left: 5px;
            border: 1px solid #ccc;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: inherit;
            resize: vertical;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .btn-save {
            background: #27ae60;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background: #c0392b;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print {
            background: #2980b9;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            width: 450px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            display: none;
            z-index: 1000;
            color: white;
            font-weight: bold;
        }
        
        @media print {
            .sidebar, .grid-section, .action-buttons, .header, .btn-add-equipment, .btn-delete, .user-info, .version-bar {
                display: none;
            }
            .content-area {
                margin: 0;
                padding: 0;
            }
            .test-group {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h2>T&C Koshi</h2>
            <h3>PTR Test Report Management System</h3>
            <div id="loginError" class="error-msg"></div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
            <p style="text-align: center; margin-top: 20px; color: #666;">Demo: admin / admin123</p>
        </div>
    </div>

    <div id="mainApp" class="app-container">
        <div class="version-bar">
            <i class="fas fa-code-branch"></i> Version 2.0 | Last Deployed: <span id="deployTime"></span>
        </div>
        <div class="header">
            <h2>T&C Koshi - PTR Test Report Management</h2>
            <div>
                <span id="userNameDisplay"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <div class="grid-section">
                <div class="grid-buttons" id="gridButtons"></div>
                <button class="btn-add" onclick="showAddGridModal()">+ New Grid</button>
            </div>

            <div class="main-layout">
                <div class="sidebar">
                    <div class="menu-section">
                        <div class="menu-title">POWER TRANSFORMERS</div>
                        <ul class="equipment-list" id="transformerList"></ul>
                        <button class="btn-add-equipment" onclick="showAddEquipmentModal()">+ Add PTR</button>
                    </div>
                </div>

                <div class="content-area">
                    <div id="testArea">
                        <div class="current-equipment" id="currentEquipmentDisplay">
                            Select a PTR from the menu to begin testing
                        </div>
                        <div id="testForm"></div>
                        <div class="action-buttons" id="actionButtons" style="display: none;">
                            <button class="btn-save" onclick="saveTestData()">Save Test Results</button>
                            <button class="btn-pdf" onclick="generateFullReport()">Download PDF</button>
                            <button class="btn-print" onclick="printFullReport()">Print Report</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addGridModal" class="modal">
        <div class="modal-content">
            <h3>Add New Grid</h3>
            <input type="text" id="gridName" placeholder="Grid Name">
            <input type="text" id="gridLocation" placeholder="Location">
            <div class="modal-buttons">
                <button class="btn-save" onclick="addGrid()">Add</button>
                <button class="btn-pdf" onclick="closeModal('addGridModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="addEquipmentModal" class="modal">
        <div class="modal-content">
            <h3>Add Power Transformer (PTR)</h3>
            <input type="text" id="eqId" placeholder="Equipment ID (e.g., PTR-01)">
            <input type="text" id="eqRating" placeholder="Rating (e.g., 20 MVA)">
            <input type="text" id="eqMake" placeholder="Make (e.g., CGL, BHEL)">
            <input type="text" id="eqSerial" placeholder="Serial Number">
            <select id="eqVoltage">
                <option value="132/33kV">Voltage Ratio: 132/33 kV</option>
                <option value="220/132kV">Voltage Ratio: 220/132 kV</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-save" onclick="addEquipment()">Add PTR</button>
                <button class="btn-pdf" onclick="closeModal('addEquipmentModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

    <script>
        const API_URL = '/api';
        let authToken = localStorage.getItem('token');
        let currentGrid = null;
        let currentEquipment = null;
        let currentUser = null;

        // Set deployment timestamp
        document.getElementById('deployTime').innerHTML = new Date().toLocaleString();

        // [REST OF YOUR JAVASCRIPT CODE - Same as before]
        // ... (keep all your existing JavaScript functions here)
        
        // For brevity, I'm showing the key functions, but keep all your existing code
        // Make sure to keep your existing login(), loadGrids(), loadEquipment(), etc.
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    authToken = data.token;
                    currentUser = data.user;
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('userNameDisplay').innerHTML = data.user.fullName || data.user.username;
                    await loadGrids();
                    showStatus('Login successful!', '#27ae60');
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Cannot connect to server.');
            }
        }

        // [Keep all your other functions: loadGrids, loadEquipment, loadTestForm, 
        //  collectFormData, saveTestData, generateFullReport, printFullReport,
        //  addEquipment, deleteEquipment, addGrid, etc.]

        function showStatus(msg, color) {
            const div = document.getElementById('statusMsg');
            div.textContent = msg;
            div.style.backgroundColor = color;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 3000);
        }

        function showError(msg) {
            const div = document.getElementById('loginError');
            div.textContent = msg;
            div.style.display = 'block';
        }

        if (authToken) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerHTML = user.fullName || user.username;
            loadGrids();
        }
    </script>
</body>
</html>
