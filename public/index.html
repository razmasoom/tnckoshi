<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&C Koshi - PTR Test Report System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
        }
        .login-card {
            background: white;
            border-radius: 8px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .login-card h2 { margin-bottom: 10px; color: #2c3e50; text-align: center; }
        .login-card h3 { text-align: center; margin-bottom: 30px; color: #666; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .login-btn:hover { background: #1a2a3a; }
        .error-msg { color: red; margin-bottom: 15px; display: none; text-align: center; }
        
        .app-container { display: none; }
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-logout {
            background: #c0392b;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        .grid-section {
            background: white;
            border: 1px solid #ddd;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .grid-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .grid-btn {
            padding: 8px 20px;
            border: 1px solid #ddd;
            cursor: pointer;
            background: #f8f9fa;
        }
        .grid-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            padding: 8px 20px;
            border: none;
            cursor: pointer;
        }
        
        .main-layout { display: flex; gap: 20px; }
        .sidebar {
            width: 280px;
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            height: fit-content;
        }
        .content-area {
            flex: 1;
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
        }
        
        .menu-section { margin-bottom: 25px; }
        .menu-title {
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            background: #2c3e50;
            color: white;
            margin-bottom: 10px;
            text-align: center;
        }
        .equipment-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .equipment-list li {
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            background: #f8f9fa;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .equipment-list li.active {
            background: #2c3e50;
            color: white;
        }
        .btn-add-equipment {
            width: 100%;
            padding: 8px;
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
        }
        
        .current-equipment {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #2c3e50;
        }
        .test-group {
            background: #fefefe;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-group h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }
        .test-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 13px;
        }
        .test-table th, .test-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .test-table th {
            background: #f5f5f5;
            font-weight: bold;
        }
        .test-table input {
            width: 80px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 2px;
            text-align: center;
        }
        .inline-input {
            display: inline-block;
            margin: 0 15px 10px 0;
        }
        .inline-input input {
            width: 100px;
            padding: 5px;
            margin-left: 5px;
            border: 1px solid #ddd;
            border-radius: 2px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            font-family: inherit;
            resize: vertical;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .btn-save {
            background: #27ae60;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background: #c0392b;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print {
            background: #2980b9;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            width: 450px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            display: none;
            z-index: 1000;
            color: white;
            font-weight: bold;
        }
        
        @media print {
            .sidebar, .grid-section, .action-buttons, .header, .btn-add-equipment, .btn-delete, .user-info {
                display: none;
            }
            .content-area {
                margin: 0;
                padding: 0;
            }
            .test-group {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h2>T&C Koshi</h2>
            <h3>PTR Test Report Management System</h3>
            <div id="loginError" class="error-msg"></div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
            <p style="text-align: center; margin-top: 20px; color: #666;">Demo: admin / admin123</p>
        </div>
    </div>

    <div id="mainApp" class="app-container">
        <div class="header">
            <h2>T&C Koshi - PTR Test Report Management</h2>
            <div>
                <span id="userNameDisplay"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <div class="grid-section">
                <div class="grid-buttons" id="gridButtons"></div>
                <button class="btn-add" onclick="showAddGridModal()">+ New Grid</button>
            </div>

            <div class="main-layout">
                <div class="sidebar">
                    <div class="menu-section">
                        <div class="menu-title">POWER TRANSFORMERS</div>
                        <ul class="equipment-list" id="transformerList"></ul>
                        <button class="btn-add-equipment" onclick="showAddEquipmentModal()">+ Add PTR</button>
                    </div>
                </div>

                <div class="content-area">
                    <div id="testArea">
                        <div class="current-equipment" id="currentEquipmentDisplay">
                            Select a PTR from the menu to begin testing
                        </div>
                        <div id="testForm"></div>
                        <div class="action-buttons" id="actionButtons" style="display: none;">
                            <button class="btn-save" onclick="saveTestData()">Save Test Results</button>
                            <button class="btn-pdf" onclick="generatePTRPdf()">Download PDF</button>
                            <button class="btn-print" onclick="printPTRReport()">Print Report</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addGridModal" class="modal">
        <div class="modal-content">
            <h3>Add New Grid</h3>
            <input type="text" id="gridName" placeholder="Grid Name">
            <input type="text" id="gridLocation" placeholder="Location">
            <div class="modal-buttons">
                <button class="btn-save" onclick="addGrid()">Add</button>
                <button class="btn-pdf" onclick="closeModal('addGridModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="addEquipmentModal" class="modal">
        <div class="modal-content">
            <h3>Add Power Transformer (PTR)</h3>
            <input type="text" id="eqId" placeholder="Equipment ID (e.g., PTR-01)">
            <input type="text" id="eqRating" placeholder="Rating (e.g., 20 MVA)">
            <input type="text" id="eqMake" placeholder="Make (e.g., CGL, BHEL)">
            <input type="text" id="eqSerial" placeholder="Serial Number">
            <select id="eqVoltage">
                <option value="132/33kV">Voltage Ratio: 132/33 kV</option>
                <option value="220/132kV">Voltage Ratio: 220/132 kV</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-save" onclick="addEquipment()">Add PTR</button>
                <button class="btn-pdf" onclick="closeModal('addEquipmentModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

    <script>
        const API_URL = '/api';
        let authToken = localStorage.getItem('token');
        let currentGrid = null;
        let currentEquipment = null;
        let currentUser = null;

        let testData = {
            dateOfTesting: new Date().toISOString().split('T')[0],
            otiTemp: '',
            wtiHvTemp: '',
            wtiLvTemp: '',
            // Tap positions (user can enter any values)
            tapPositions: ['', '', ''],
            // Core Balance
            coreBalance: { VRY: '', VYB: '', VRB: '' },
            // Magnetising Current - 3 tap rows
            magnetisingRows: [
                { tap: '', vrn: '', vyn: '', vbn: '', vrn_lv: '', vyn_lv: '', vbn_lv: '' },
                { tap: '', vrn: '', vyn: '', vbn: '', vrn_lv: '', vyn_lv: '', vbn_lv: '' },
                { tap: '', vrn: '', vyn: '', vbn: '', vrn_lv: '', vyn_lv: '', vbn_lv: '' }
            ],
            // Short Circuit - 3 tap rows
            shortCircuitRows: [
                { tap: '', ir: '', iy: '', ib: '', ir_lv: '', iy_lv: '', ib_lv: '', in_hv: '', in_lv: '' },
                { tap: '', ir: '', iy: '', ib: '', ir_lv: '', iy_lv: '', ib_lv: '', in_hv: '', in_lv: '' },
                { tap: '', ir: '', iy: '', ib: '', ir_lv: '', iy_lv: '', ib_lv: '', in_hv: '', in_lv: '' }
            ],
            // Vector Group
            vectorGroup: { v1v2: '', v1w2: '', w1v2: '', w1w2: '', un: '' },
            // Winding Resistance - 3 tap rows with temps
            windingRows: [
                { tap: '', hv_u: '', hv_v: '', hv_w: '', lv_u: '', lv_v: '', lv_w: '' },
                { tap: '', hv_u: '', hv_v: '', hv_w: '', lv_u: '', lv_v: '', lv_w: '' },
                { tap: '', hv_u: '', hv_v: '', hv_w: '', lv_u: '', lv_v: '', lv_w: '' }
            ],
            // Insulation Resistance
            insulationResistance: {
                hv_lv_60: '', hv_lv_600: '', hv_lv_pi: '',
                hv_e_60: '', hv_e_600: '', hv_e_pi: '',
                lv_e_60: '', lv_e_600: '', lv_e_pi: ''
            },
            // CFT Insulation
            cftInsulation: { core_frame: '', frame_tank: '', core_tank: '' },
            // Turn Ratio - 3 tap rows
            turnRatioRows: [
                { tap: '', u: '', v: '', w: '' },
                { tap: '', u: '', v: '', w: '' },
                { tap: '', u: '', v: '', w: '' }
            ],
            // DC Voltage
            dcVoltage: { positive_negative: '', positive_earth: '', negative_earth: '' },
            // Earthing Resistance
            earthingResistance: { hv_e: '', lv_e: '', body: '' },
            // Signatories
            critlSign: '',
            tcSign: '',
            fieldSign: '',
            notes: ''
        };

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    authToken = data.token;
                    currentUser = data.user;
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('userNameDisplay').innerHTML = data.user.fullName || data.user.username;
                    await loadGrids();
                    showStatus('Login successful!', '#27ae60');
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Cannot connect to server.');
            }
        }

        async function loadGrids() {
            try {
                const response = await fetch(`${API_URL}/grids`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const grids = await response.json();
                const container = document.getElementById('gridButtons');
                container.innerHTML = '';
                
                grids.forEach(grid => {
                    const btn = document.createElement('button');
                    btn.className = 'grid-btn';
                    btn.textContent = grid.name;
                    btn.onclick = () => {
                        document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentGrid = grid;
                        loadEquipment();
                    };
                    container.appendChild(btn);
                });
                
                if (grids.length > 0 && !currentGrid) {
                    document.querySelector('.grid-btn').click();
                }
            } catch (error) {
                showStatus('Error loading grids', '#e74c3c');
            }
        }

        async function loadEquipment() {
            if (!currentGrid) return;
            try {
                const response = await fetch(`${API_URL}/equipment/${currentGrid._id}/transformer`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const equipment = await response.json();
                const container = document.getElementById('transformerList');
                container.innerHTML = '';
                
                if (equipment.length === 0) {
                    container.innerHTML = '<li style="text-align: center; color: #999;">No PTRs. Click "Add PTR"</li>';
                    return;
                }
                
                equipment.forEach(eq => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div style="flex:1">
                            <strong>${eq.equipmentId}</strong>
                            <div style="font-size: 11px;">${eq.rating || ''} | ${eq.make || ''}</div>
                        </div>
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteEquipment('${eq._id}')">✖</button>
                    `;
                    li.onclick = () => {
                        document.querySelectorAll('.equipment-list li').forEach(l => l.classList.remove('active'));
                        li.classList.add('active');
                        currentEquipment = eq;
                        if (eq.testValues && eq.testValues[0]) {
                            try {
                                Object.assign(testData, JSON.parse(eq.testValues[0]));
                            } catch(e) {}
                        }
                        if (eq.remarks) testData.notes = eq.remarks;
                        loadTestForm();
                        document.getElementById('actionButtons').style.display = 'flex';
                    };
                    container.appendChild(li);
                });
            } catch (error) {
                console.error(error);
            }
        }

        function loadTestForm() {
            const html = `
                <div class="current-equipment">
                    <strong>${currentEquipment.rating || ''} ${currentEquipment.equipmentId} (Make: ${currentEquipment.make || 'N/A'})</strong><br>
                    Date: <input type="date" id="testDate" value="${testData.dateOfTesting}">
                </div>
                
                <div class="test-group">
                    <h4>Temperature Readings</h4>
                    <span class="inline-input">OTI: <input type="text" id="oti" value="${testData.otiTemp}" style="width:60px"> °C</span>
                    <span class="inline-input">WTI (HV): <input type="text" id="wti_hv" value="${testData.wtiHvTemp}" style="width:60px"> °C</span>
                    <span class="inline-input">WTI (LV): <input type="text" id="wti_lv" value="${testData.wtiLvTemp}" style="width:60px"> °C</span>
                </div>

                <div class="test-group">
                    <h4>(1) Core Balance and Magnetising Current Test</h4>
                    <div style="margin-bottom: 10px;">
                        <span class="inline-input">VRY: <input type="text" id="cb_vry" value="${testData.coreBalance.VRY}" style="width:80px"> V</span>
                        <span class="inline-input">VYB: <input type="text" id="cb_vyb" value="${testData.coreBalance.VYB}" style="width:80px"> V</span>
                        <span class="inline-input">VRB: <input type="text" id="cb_vrb" value="${testData.coreBalance.VRB}" style="width:80px"> V</span>
                    </div>
                    <table class="test-table">
                        <tr><th>Tap Position</th><th>VRN (HV)</th><th>VYN (HV)</th><th>VBN (HV)</th><th>Vrn (LV)</th><th>Vyn (LV)</th><th>Vbn (LV)</th></tr>
                        ${[0,1,2].map(i => `
                            <tr>
                                <td><input type="text" id="mag_tap_${i}" value="${testData.magnetisingRows[i].tap}" placeholder="e.g., 5,9,13" style="width:60px"></td>
                                ${['vrn','vyn','vbn','vrn_lv','vyn_lv','vbn_lv'].map(field => `
                                    <td><input type="text" id="mag_${i}_${field}" value="${testData.magnetisingRows[i][field] || ''}" style="width:70px"></td>
                                `).join('')}
                            </tr>
                        `).join('')}
                    </table>
                </div>

                <div class="test-group">
                    <h4>(2) Short Circuit Test</h4>
                    <table class="test-table">
                        <tr><th>Tap Position</th><th>IR (HV)</th><th>IY (HV)</th><th>IB (HV)</th><th>Ir (LV)</th><th>Iy (LV)</th><th>Ib (LV)</th><th>IN (HV)</th><th>In (LV)</th></tr>
                        ${[0,1,2].map(i => `
                            <tr>
                                <td><input type="text" id="sc_tap_${i}" value="${testData.shortCircuitRows[i].tap}" placeholder="Tap" style="width:60px"></td>
                                ${['ir','iy','ib','ir_lv','iy_lv','ib_lv','in_hv','in_lv'].map(field => `
                                    <td><input type="text" id="sc_${i}_${field}" value="${testData.shortCircuitRows[i][field] || ''}" style="width:55px"></td>
                                `).join('')}
                            </tr>
                        `).join('')}
                    </table>
                </div>

                <div class="test-group">
                    <h4>(3) Vector Group (YNyn0)</h4>
                    <table class="test-table">
                        <tr><th>1V-2V</th><th>1V-2W</th><th>1W-2V</th><th>1W-2W</th><th>1UN = 2Un + Nn</th></tr>
                        <tr>
                            <td><input type="text" id="vg_v1v2" value="${testData.vectorGroup.v1v2}" style="width:80px"></td>
                            <td><input type="text" id="vg_v1w2" value="${testData.vectorGroup.v1w2}" style="width:80px"></td>
                            <td><input type="text" id="vg_w1v2" value="${testData.vectorGroup.w1v2}" style="width:80px"></td>
                            <td><input type="text" id="vg_w1w2" value="${testData.vectorGroup.w1w2}" style="width:80px"></td>
                            <td><input type="text" id="vg_un" value="${testData.vectorGroup.un}" style="width:80px"></td>
                        </tr>
                    </table>
                </div>

                <div class="test-group">
                    <h4>(4) Winding Resistance Test</h4>
                    <table class="test-table">
                        <tr><th>Tap Position</th><th>HV U-N</th><th>HV V-N</th><th>HV W-N</th><th>LV u-n</th><th>LV v-n</th><th>LV w-n</th></tr>
                        ${[0,1,2].map(i => `
                            <tr>
                                <td><input type="text" id="wr_tap_${i}" value="${testData.windingRows[i].tap}" placeholder="Tap" style="width:60px"></td>
                                ${['hv_u','hv_v','hv_w','lv_u','lv_v','lv_w'].map(field => `
                                    <td><input type="text" id="wr_${i}_${field}" value="${testData.windingRows[i][field] || ''}" style="width:70px"></td>
                                `).join('')}
                            </tr>
                        `).join('')}
                    </table>
                </div>

                <div class="test-group">
                    <h4>(5) Insulation Resistance Test (Applied Voltage: 5 kV)</h4>
                    <table class="test-table">
                        <tr><th></th><th>60 Sec</th><th>600 Sec</th><th>PI</th></tr>
                        <tr>
                            <td>HV-LV</td>
                            ${['hv_lv_60','hv_lv_600','hv_lv_pi'].map(f => `<td><input type="text" id="ir_${f}" value="${testData.insulationResistance[f] || ''}" style="width:70px"></td>`).join('')}
                        </tr>
                        <tr>
                            <td>HV-E</td>
                            ${['hv_e_60','hv_e_600','hv_e_pi'].map(f => `<td><input type="text" id="ir_${f}" value="${testData.insulationResistance[f] || ''}" style="width:70px"></td>`).join('')}
                        </tr>
                        <tr>
                            <td>LV-E</td>

                    <span class="inline-input">-VE to Earth: <input type="text" id="dc_ne" value="${testData.dcVoltage.negative_earth}" style="width:80px"> V</span>
                </div>

                <div class="test-group">
                    <h4>(9) Earthing Resistance</h4>
                    <span class="inline-input">HV-E: <input type="text" id="er_hve" value="${testData.earthingResistance.hv_e}" style="width:80px"> ohm</span>
                    <span class="inline-input">LV-E: <input type="text" id="er_lve" value="${testData.earthingResistance.lv_e}" style="width:80px"> ohm</span>
                    <span class="inline-input">Body: <input type="text" id="er_body" value="${testData.earthingResistance.body}" style="width:80px"> ohm</span>
                </div>

                <div class="test-group">
                    <h4>Signatories</h4>
                    <table class="test-table">
                        <tr><th>CRITL</th><th>T&C Koshi</th><th>Field</th></tr>
                        <tr>
                            <td><input type="text" id="sign_critl" value="${testData.critlSign}" placeholder="Name & Signature" style="width:150px"></td>
                            <td><input type="text" id="sign_tc" value="${testData.tcSign}" placeholder="Name & Signature" style="width:150px"></td>
                            <td><input type="text" id="sign_field" value="${testData.fieldSign}" placeholder="Name & Signature" style="width:150px"></td>
                        </tr>
                    </table>
                </div>

                <div class="test-group">
                    <h4>Remarks / Notes</h4>
                    <textarea id="notes" rows="3">${testData.notes}</textarea>
                </div>
            `;
            document.getElementById('testForm').innerHTML = html;
        }

        function collectFormData() {
            testData.dateOfTesting = document.getElementById('testDate')?.value || new Date().toISOString().split('T')[0];
            testData.otiTemp = document.getElementById('oti')?.value || '';
            testData.wtiHvTemp = document.getElementById('wti_hv')?.value || '';
            testData.wtiLvTemp = document.getElementById('wti_lv')?.value || '';
            
            testData.coreBalance = {

                VYB: document.getElementById('cb_vyb')?.value || '',
                VRB: document.getElementById('cb_vrb')?.value || ''
            };
            
            for (let i = 0; i < 3; i++) {
                testData.magnetisingRows[i] = {
                    tap: document.getElementById(`mag_tap_${i}`)?.value || '',

                };
                
                testData.shortCircuitRows[i] = {
                    tap: document.getElementById(`sc_tap_${i}`)?.value || '',
                    ir: document.getElementById(`sc_${i}_ir`)?.value || '',
                    iy: document.getElementById(`sc_${i}_iy`)?.value || '',
                    ib: document.getElementById(`sc_${i}_ib`)?.value || '',
                    ir_lv: document.getElementById(`sc_${i}_ir_lv`)?.value || '',
                    iy_lv: document.getElementById(`sc_${i}_iy_lv`)?.value || '',
                    ib_lv: document.getElementById(`sc_${i}_ib_lv`)?.value || '',
                    in_hv: document.getElementById(`sc_${i}_in_hv`)?.value || '',
                    in_lv: document.getElementById(`sc_${i}_in_lv`)?.value || ''
                };
                
                testData.windingRows[i] = {
                    tap: document.getElementById(`wr_tap_${i}`)?.value || '',
                    hv_u: document.getElementById(`wr_${i}_hv_u`)?.value || '',
                    hv_v: document.getElementById(`wr_${i}_hv_v`)?.value || '',
                    hv_w: document.getElementById(`wr_${i}_hv_w`)?.value || '',
                    lv_u: document.getElementById(`wr_${i}_lv_u`)?.value || '',
                    lv_v: document.getElementById(`wr_${i}_lv_v`)?.value || '',
                    lv_w: document.getElementById(`wr_${i}_lv_w`)?.value || ''
                };
                
                testData.turnRatioRows[i] = {
                    tap: document.getElementById(`tr_tap_${i}`)?.value || '',
                    u: document.getElementById(`tr_${i}_u`)?.value || '',
                    v: document.getElementById(`tr_${i}_v`)?.value || '',

            }
            
            testData.vectorGroup = {

                w1v2: document.getElementById('vg_w1v2')?.value || '',
                w1w2: document.getElementById('vg_w1w2')?.value || '',
                un: document.getElementById('vg_un')?.value || ''
            };
            
            for (let field of ['hv_lv_60','hv_lv_600','hv_lv_pi','hv_e_60','hv_e_600','hv_e_pi','lv_e_60','lv_e_600','lv_e_pi']) {
                testData.insulationResistance[field] = document.getElementById(`ir_${field}`)?.value || '';
            }
            
            testData.cftInsulation = {
                core_frame: document.getElementById('cft_cf')?.value || '',
                frame_tank: document.getElementById('cft_ft')?.value || '',

            };

                positive_negative: document.getElementById('dc_pn')?.value || '',
                positive_earth: document.getElementById('dc_pe')?.value || '',

            testData.critlSign = document.getElementById('sign_critl')?.value || '';
            testData.tcSign = document.getElementById('sign_tc')?.value || '';
            testData.fieldSign = document.getElementById('sign_field')?.value || '';
            testData.notes = document.getElementById('notes')?.value || '';
        }

        async function saveTestData() {
            if (!currentEquipment) { showStatus('No PTR selected', '#e74c3c'); return; }
            collectFormData();
            
            try {
                const response = await fetch(`${API_URL}/equipment/${currentEquipment._id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ 
                        testValues: [JSON.stringify(testData)], 
                        remarks: testData.notes 
                    })
                });
                if (response.ok) {
                    showStatus('Test data saved successfully!', '#27ae60');
                } else {
                    showStatus('Error saving data', '#e74c3c');
                }
            } catch (error) {
                showStatus('Error saving data', '#e74c3c');
            }
        }

        function generatePTRPdf() {
            if (!currentEquipment) { showStatus('No PTR selected', '#e74c3c'); return; }
            collectFormData();
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            let y = 25;
            
            // Header
            doc.setFontSize(16);
            doc.setFont(undefined, 'bold');
            doc.text("T&C Koshi - PTR Test Report", 20, y);
            y += 10;
            
            doc.setFontSize(11);
            doc.setFont(undefined, 'normal');
            doc.text(`${currentEquipment.rating || ''} ${currentEquipment.equipmentId} (Make: ${currentEquipment.make || 'N/A'})`, 20, y);
            y += 7;
            doc.text(`Date of Testing: ${testData.dateOfTesting}`, 20, y);
            y += 7;
            doc.text(`Temperatures: OTI: ${testData.otiTemp || '-'}°C | WTI HV: ${testData.wtiHvTemp || '-'}°C | WTI LV: ${testData.wtiLvTemp || '-'}°C`, 20, y);
            y += 12;
            
            function addSection(title, yPos) {
                doc.setFontSize(11);
                doc.setFont(undefined, 'bold');
                doc.text(title, 20, yPos);
                doc.setFont(undefined, 'normal');
                return yPos + 6;
            }
            
            // 1. Core Balance
            y = addSection("(1) Core Balance and Magnetising Current Test:", y);
            doc.setFontSize(9);
            doc.text(`VRY: ${testData.coreBalance.VRY || '-'}V    VYB: ${testData.coreBalance.VYB || '-'}V    VRB: ${testData.coreBalance.VRB || '-'}V`, 25, y);
            y += 6;
            
            let headers1 = ['Tap', 'VRN', 'VYN', 'VBN', 'Vrn', 'Vyn', 'Vbn'];
            for (let i = 0; i < headers1.length; i++) {
                doc.rect(20 + (i * 23), y, 23, 7);
                doc.text(headers1[i], 20 + (i * 23) + 2, y + 5);
            }
            y += 7;
            
            for (let row of testData.magnetisingRows) {
                let values = [row.tap || '-', row.vrn || '-', row.vyn || '-', row.vbn || '-', row.vrn_lv || '-', row.vyn_lv || '-', row.vbn_lv || '-'];
                for (let i = 0; i < values.length; i++) {
                    doc.rect(20 + (i * 23), y, 23, 7);
                    doc.text(String(values[i]), 20 + (i * 23) + 2, y + 5);
                }
                y += 7;
                if (y > 270) { doc.addPage(); y = 20; }
            }
            y += 4;
            
            // 2. Short Circuit
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(2) Short Circuit Test:", y);
            
            let scHeaders = ['Tap', 'IR', 'IY', 'IB', 'Ir', 'Iy', 'Ib', 'IN', 'In'];
            for (let i = 0; i < scHeaders.length; i++) {
                doc.rect(20 + (i * 17), y, 17, 7);
                doc.text(scHeaders[i], 20 + (i * 17) + 1, y + 5);
            }
            y += 7;
            
            for (let row of testData.shortCircuitRows) {
                let values = [row.tap || '-', row.ir || '-', row.iy || '-', row.ib || '-', row.ir_lv || '-', row.iy_lv || '-', row.ib_lv || '-', row.in_hv || '-', row.in_lv || '-'];
                for (let i = 0; i < values.length; i++) {
                    doc.rect(20 + (i * 17), y, 17, 7);
                    doc.text(String(values[i]), 20 + (i * 17) + 1, y + 5);
                }
                y += 7;
                if (y > 270) { doc.addPage(); y = 20; }
            }
            y += 4;
            
            // 3. Vector Group
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(3) Vector Group (YNyn0):", y);
            doc.text(`1V-2V: ${testData.vectorGroup.v1v2 || '-'}V    1V-2W: ${testData.vectorGroup.v1w2 || '-'}V`, 25, y);
            y += 6;
            doc.text(`1W-2V: ${testData.vectorGroup.w1v2 || '-'}V    1W-2W: ${testData.vectorGroup.w1w2 || '-'}V`, 25, y);
            y += 6;
            doc.text(`1UN = 2Un + Nn: ${testData.vectorGroup.un || '-'}V`, 25, y);
            y += 10;
            
            // 4. Winding Resistance
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(4) Winding Resistance Test:", y);
            
            let wrHeaders = ['Tap', 'HV U-N', 'HV V-N', 'HV W-N', 'LV u-n', 'LV v-n', 'LV w-n'];
            for (let i = 0; i < wrHeaders.length; i++) {
                doc.rect(20 + (i * 25), y, 25, 7);
                doc.text(wrHeaders[i], 20 + (i * 25) + 2, y + 5);
            }
            y += 7;
            
            for (let row of testData.windingRows) {
                let values = [row.tap || '-', row.hv_u || '-', row.hv_v || '-', row.hv_w || '-', row.lv_u || '-', row.lv_v || '-', row.lv_w || '-'];
                for (let i = 0; i < values.length; i++) {
                    doc.rect(20 + (i * 25), y, 25, 7);
                    doc.text(String(values[i]), 20 + (i * 25) + 2, y + 5);
                }
                y += 7;
                if (y > 270) { doc.addPage(); y = 20; }
            }
            y += 4;
            
            // 5. Insulation Resistance
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(5) Insulation Resistance Test:", y);
            
            let irHeaders = ['', '60 Sec', '600 Sec', 'PI'];
            for (let i = 0; i < irHeaders.length; i++) {
                doc.rect(20 + (i * 38), y, 38, 7);
                doc.text(irHeaders[i], 20 + (i * 38) + 5, y + 5);
            }
            y += 7;
            
            let irRows = [
                ['HV-LV', testData.insulationResistance.hv_lv_60, testData.insulationResistance.hv_lv_600, testData.insulationResistance.hv_lv_pi],
                ['HV-E', testData.insulationResistance.hv_e_60, testData.insulationResistance.hv_e_600, testData.insulationResistance.hv_e_pi],
                ['LV-E', testData.insulationResistance.lv_e_60, testData.insulationResistance.lv_e_600, testData.insulationResistance.lv_e_pi]
            ];
            
            for (let row of irRows) {
                for (let i = 0; i < row.length; i++) {
                    doc.rect(20 + (i * 38), y, 38, 7);
                    doc.text(String(row[i] || '-'), 20 + (i * 38) + 5, y + 5);
                }
                y += 7;
                if (y > 270) { doc.addPage(); y = 20; }
            }
            y += 4;
            
            // 6. CFT
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(6) CFT Insulation Resistance Test:", y);
            doc.text(`Core-Frame: ${testData.cftInsulation.core_frame || '-'} GΩ`, 25, y);
            y += 6;
            doc.text(`Frame-Tank: ${testData.cftInsulation.frame_tank || '-'} GΩ`, 25, y);
            y += 6;
            doc.text(`Core-Tank: ${testData.cftInsulation.core_tank || '-'} GΩ`, 25, y);
            y += 10;
            
            // 7. Turn Ratio
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(7) Turn Ratio Test:", y);
            
            let trHeaders = ['Tap', 'Phase U', 'Phase V', 'Phase W'];
            for (let i = 0; i < trHeaders.length; i++) {
                doc.rect(20 + (i * 40), y, 40, 7);
                doc.text(trHeaders[i], 20 + (i * 40) + 5, y + 5);
            }
            y += 7;
            
            for (let row of testData.turnRatioRows) {
                let values = [row.tap || '-', row.u || '-', row.v || '-', row.w || '-'];
                for (let i = 0; i < values.length; i++) {
                    doc.rect(20 + (i * 40), y, 40, 7);
                    doc.text(String(values[i]), 20 + (i * 40) + 5, y + 5);
                }
                y += 7;
                if (y > 270) { doc.addPage(); y = 20; }
            }
            y += 8;
            
            // 8. DC Voltage
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(8) DC Voltage:", y);
            doc.text(`+VE to -VE: ${testData.dcVoltage.positive_negative || '-'} V`, 25, y);
            y += 6;
            doc.text(`+VE to Earth: ${testData.dcVoltage.positive_earth || '-'} V`, 25, y);
            y += 6;
            doc.text(`-VE to Earth: ${testData.dcVoltage.negative_earth || '-'} V`, 25, y);
            y += 10;
            
            // 9. Earthing Resistance
            if (y > 250) { doc.addPage(); y = 20; }
            y = addSection("(9) Earthing Resistance:", y);
            doc.text(`HV-E: ${testData.earthingResistance.hv_e || '-'} ohm`, 25, y);
            y += 6;
            doc.text(`LV-E: ${testData.earthingResistance.lv_e || '-'} ohm`, 25, y);
            y += 6;
            doc.text(`Body: ${testData.earthingResistance.body || '-'} ohm`, 25, y);
            y += 12;
            
            // Remarks
            if (y > 260) { doc.addPage(); y = 20; }
            y = addSection("Remarks:", y);
            let remarks = testData.notes || 'No remarks';
            let splitRemarks = doc.splitTextToSize(remarks, 160);
            doc.text(splitRemarks, 25, y);
            y += splitRemarks.length * 5 + 10;
            
            // SIGNATORIES
            if (y > 250) { doc.addPage(); y = 20; }
            doc.setDrawColor(0);
            doc.setLineWidth(0.5);
            doc.rect(20, y, 170, 45);
            
            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.text("APPROVALS", 20, y + 8);
            
            doc.setFont(undefined, 'normal');
            doc.setFontSize(10);
            
            doc.text("CRITL:", 30, y + 22);
            doc.line(55, y + 22, 100, y + 22);
            doc.text(testData.critlSign || '____________________', 55, y + 20);
            
            doc.text("T&C Koshi:", 30, y + 35);
            doc.line(55, y + 35, 100, y + 35);
            doc.text(testData.tcSign || '____________________', 55, y + 33);
            
            doc.text("Field:", 120, y + 22);
            doc.line(140, y + 22, 180, y + 22);
            doc.text(testData.fieldSign || '____________________', 140, y + 20);
            
            doc.text("(Signature / Stamp)", 30, y + 42);
            doc.text("(Signature / Stamp)", 120, y + 42);
            
            // Footer
            let pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.text(`T&C Koshi - PTR Test Report - Page ${i} of ${pageCount}`, 20, 290);
            }
            
            doc.save(`PTR_Test_Report_${currentEquipment.equipmentId}_${testData.dateOfTesting}.pdf`);
            showStatus('PDF downloaded successfully!', '#27ae60');
        }

                        <tr><td>HV-LV</td><td>${testData.insulationResistance.hv_lv_60 || '-'}</td><td>${testData.insulationResistance.hv_lv_600 || '-'}</td><td>${testData.insulationResistance.hv_lv_pi || '-'}</td></tr>
                        <tr><td>HV-E</td><td>${testData.insulationResistance.hv_e_60 || '-'}</td><td>${testData.insulationResistance.hv_e_600 || '-'}</td><td>${testData.insulationResistance.hv_e_pi || '-'}</td></tr>
                        <tr><td>LV-E</td><td>${testData.insulationResistance.lv_e_60 || '-'}</td><td>${testData.insulationResistance.lv_e_600 || '-'}</td><td>${testData.insulationResistance.lv_e_pi || '-'}</td></tr>
                        </table>
                    </div>
                    
                    <div class="section">
                        <h3>(6) CFT Insulation</h3>
                        <p>Core-Frame: ${testData.cftInsulation.core_frame || '-'} GΩ | Frame-Tank: ${testData.cftInsulation.frame_tank || '-'} GΩ | Core-Tank: ${testData.cftInsulation.core_tank || '-'} GΩ</p>
                    </div>
                    
                    <div class="section">
                        <h3>(7) Turn Ratio Test</h3>
                        <tr><th>Tap</th><th>Phase U</th><th>Phase V</th><th>Phase W</th></tr>
                        ${testData.turnRatioRows.map(r => `<tr><td>${r.tap || '-'}</td><td>${r.u || '-'}</td><td>${r.v || '-'}</td><td>${r.w || '-'}</td></tr>`).join('')}
                        </table>
                    </div>
                    
                    <div class="section">
                        <h3>(8) DC Voltage</h3>
                        <p>+VE to -VE: ${testData.dcVoltage.positive_negative || '-'}V | +VE to Earth: ${testData.dcVoltage.positive_earth || '-'}V | -VE to Earth: ${testData.dcVoltage.negative_earth || '-'}V</p>
                    </div>
                    
                    <div class="section">
                        <h3>(9) Earthing Resistance</h3>
                        <p>HV-E: ${testData.earthingResistance.hv_e || '-'} ohm | LV-E: ${testData.earthingResistance.lv_e || '-'} ohm | Body: ${testData.earthingResistance.body || '-'} ohm</p>
                    </div>
                    
                    <div class="signature-box">
                        <table style="border: none; width: 100%;">
                            <tr><td style="border: none;"><strong>CRITL:</strong><br><br>${testData.critlSign || '____________________'}<br>(Signature)</td>
                            <td style="border: none;"><strong>T&C Koshi:</strong><br><br>${testData.tcSign || '____________________'}<br>(Signature)</td>
                            <td style="border: none;"><strong>Field:</strong><br><br>${testData.fieldSign || '____________________'}<br>(Signature)</td></tr>
                        }</div>
                    <p>Remarks: ${testData.notes || 'No remarks'}</p>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        async function addEquipment() {
            const equipmentId = document.getElementById('eqId').value.trim();
            if (!equipmentId) { showStatus('Equipment ID required', '#e74c3c'); return; }
            
            const equipmentData = {
                gridId: currentGrid._id,
                equipmentType: 'transformer',
                equipmentId: equipmentId,
                name: equipmentId,
                rating: document.getElementById('eqRating').value,
                make: document.getElementById('eqMake').value,
                serialNumber: document.getElementById('eqSerial').value,
                voltageRatio: document.getElementById('eqVoltage').value,
                testValues: []
            };
            
            try {
                const response = await fetch(`${API_URL}/equipment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(equipmentData)
                });
                if (response.ok) {
                    closeModal('addEquipmentModal');
                    showStatus('PTR added successfully!', '#27ae60');
                    loadEquipment();
                } else {
                    const error = await response.json();
                    showStatus(error.error || 'Error adding PTR', '#e74c3c');
                }
            } catch (error) {
                showStatus('Error adding PTR', '#e74c3c');
            }
        }

        async function deleteEquipment(id) {
            if (confirm('Delete this PTR? All test data will be lost!')) {
                try {
                    await fetch(`${API_URL}/equipment/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    loadEquipment();
                    if (currentEquipment && currentEquipment._id === id) {
                        currentEquipment = null;
                        document.getElementById('testForm').innerHTML = '';
                        document.getElementById('actionButtons').style.display = 'none';
                    }
                    showStatus('PTR deleted', '#27ae60');
                } catch (error) {
                    showStatus('Error deleting', '#e74c3c');
                }
            }
        }

        function showAddGridModal() {
            document.getElementById('addGridModal').style.display = 'flex';
        }

        async function addGrid() {
            const name = document.getElementById('gridName').value.trim();
            if (!name) { showStatus('Grid name required', '#e74c3c'); return; }
            
            try {
                const response = await fetch(`${API_URL}/grids`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ name, location: document.getElementById('gridLocation').value })
                });
                if (response.ok) {
                    closeModal('addGridModal');
                    showStatus('Grid added!', '#27ae60');
                    loadGrids();
                } else {
                    const error = await response.json();
                    showStatus(error.error, '#e74c3c');
                }
            } catch (error) {
                showStatus('Error adding grid', '#e74c3c');
            }
        }

        function showAddEquipmentModal() {
            if (!currentGrid) { showStatus('Please select a grid first', '#e74c3c'); return; }
            document.getElementById('addEquipmentModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showStatus(msg, color) {
            const div = document.getElementById('statusMsg');
            div.textContent = msg;
            div.style.backgroundColor = color;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 3000);
        }

        function showError(msg) {
            const div = document.getElementById('loginError');
            div.textContent = msg;
            div.style.display = 'block';
        }

        if (authToken) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userNameDisplay').innerHTML = user.fullName || user.username;
            loadGrids();
        }
    </script>
</body>
</html>
